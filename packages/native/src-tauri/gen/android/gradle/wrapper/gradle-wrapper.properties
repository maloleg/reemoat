#Tue May 10 19:22:52 CST 2022
#
# ⚠ **The distribution is pinned by hash as well as by name, and without the
# second line the wrapper installs whatever that URL serves.** `distributionUrl`
# is a *location*: `gradlew` is a 5 KB shell script, and the compiler, the Android
# plugin and every task live in a ~130 MB zip fetched at build time, unpacked into
# `~/.gradle/wrapper/dists` and executed as this user. A compromised mirror or a
# redirected DNS answer is therefore arbitrary code inside a build that looks like
# every other one, and nothing downstream notices: the APK is still produced,
# still signed with the real key, and still passes `apksigner verify`.
#
# `distributionSha256Sum` is verified by the wrapper before it unpacks anything,
# and it refuses with "Verification of Gradle distribution failed" otherwise. The
# value is the published checksum for gradle-8.14.3-bin.zip, retrieved 2026-09-19
# from https://downloads.gradle.org/distributions/gradle-8.14.3-bin.zip.sha256 and
# cross-checked against the 8.14.3 row on https://gradle.org/release-checksums/.
#
# Moving the Gradle version means replacing both halves in one edit. `nativecheck`
# asserts them as a pair for exactly that reason: a version bumped past its sum is
# a build that refuses for a reason nobody reads as "the second edit was missed".
distributionBase=GRADLE_USER_HOME
distributionUrl=https\://services.gradle.org/distributions/gradle-8.14.3-bin.zip
distributionSha256Sum=bd71102213493060956ec229d946beee57158dbd89d0e62b91bca0fa2c5f3531
distributionPath=wrapper/dists
zipStorePath=wrapper/dists
zipStoreBase=GRADLE_USER_HOME
